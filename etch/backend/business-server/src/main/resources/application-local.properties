# 합성 데이터/로컬 서비스 전용. 비밀값은 root .env → Compose에서 주입.
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/etch_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:etch}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.database=0
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:19200}
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=3s
spring.jwt.secret=${SPRING_JWT_SECRET}
app.features.oauth-enabled=false
app.features.recommendations-enabled=false
app.features.storage-enabled=false
app.auth.cookie-secure=false
app.auth.cookie-path=/api/v1
app.auth.frontend-callback-url=http://localhost:5173/Oauth
app.auth.allowed-origins=http://localhost:5173
cloud.aws.stack.auto=false
cloud.aws.region.static=us-east-1
cloud.aws.credentials.instance-profile=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.com.amazonaws.util.EC2MetadataUtils=ERROR
# 기존 스키마의 phoneNumber/isDeleted 등 명시된 이름을 유지한다.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
