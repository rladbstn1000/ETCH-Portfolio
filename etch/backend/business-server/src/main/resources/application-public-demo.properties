# 공개 체험 전용. 외부 OAuth/API 키 없이 내부 MySQL/Redis/ES와 합성 원본을 사용한다.
# local 프로필을 함께 활성화하지 않는다. 초기화/worker의 DB 쓰기는 유지한다.
server.port=8080
server.forward-headers-strategy=none
server.max-http-request-header-size=8KB
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=10s
server.tomcat.threads.max=32
server.tomcat.max-connections=128
server.tomcat.accept-count=32
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.mvc.log-resolved-exception=false
spring.servlet.multipart.enabled=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=3000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.jakarta.persistence.query.timeout=3000
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=3s
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://elasticsearch:9200}
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=3s
# Other service beans retain the JWT utility; the public-demo chain never authenticates tokens.
spring.jwt.secret=${SPRING_JWT_SECRET}
app.features.oauth-enabled=false
app.features.recommendations-enabled=false
app.features.storage-enabled=false
app.auth.cookie-secure=true
app.demo.rate-limit.max-requests=${APP_DEMO_RATE_LIMIT_MAX_REQUESTS:600}
app.demo.rate-limit.window-seconds=${APP_DEMO_RATE_LIMIT_WINDOW_SECONDS:60}
cloud.aws.stack.auto=false
cloud.aws.region.static=us-east-1
cloud.aws.credentials.instance-profile=false
management.endpoints.web.exposure.exclude=*
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.level.com.amazonaws.util.EC2MetadataUtils=ERROR
