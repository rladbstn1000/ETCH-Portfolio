input {
  jdbc {
    id => "news_incremental"
    jdbc_connection_string => "${JDBC_URL}"
    jdbc_driver_library => "${JDBC_DRIVER_LIBRARY}"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_user => "${JDBC_USER}"
    jdbc_password => "${JDBC_PASSWORD}"
    schedule => "${LOGSTASH_SCHEDULE:*/10 * * * * * UTC}"
    lowercase_column_names => false
    jdbc_paging_enabled => false
    jdbc_fetch_size => "${SYNC_FETCH_SIZE:50}"
    jdbc_default_timezone => "UTC"
    plugin_timezone => "utc"
    use_column_value => false
    clean_run => false
    record_last_run => true
    last_run_metadata_path => "/usr/share/logstash/data/checkpoints/news.yml"
    parameters => { "overlap_seconds" => "${SYNC_OVERLAP_SECONDS:120}" }
    statement_filepath => "/usr/share/logstash/query/news.sql"
    sql_log_level => "debug"
  }
}
filter {
  ruby {
    path => "/usr/share/logstash/normalize.rb"
    script_params => { "kind" => "news" }
  }
}
output {
  elasticsearch {
    id => "news_versioned_output"
    hosts => ["${ES_HOSTS}"]
    index => "news-v3"
    document_id => "%{[@metadata][source_id]}"
    action => "index"
    # 11.22.12's implicit array default was observed as [nil] during multi-pipeline restart.
    # Explicit scalar preserves its intended default; index actions do not execute a script.
    script_type => "inline"
    version => "%{[@metadata][revision]}"
    version_type => "external_gte"
    manage_template => false
    ilm_enabled => false
    data_stream => false
    ecs_compatibility => "disabled"
    silence_errors_in_log => ["version_conflict_engine_exception"]
  }
}
