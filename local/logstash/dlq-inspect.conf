# Failed JSON is retained; print only identifiers and a coarse failure class.
input {
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "${DLQ_PIPELINE:jobs}"
    commit_offsets => false
    clean_consumed => false
  }
}
filter {
  ruby {
    code => '
      kind = event.get("[@metadata][kind]")
      source_id = event.get("[@metadata][source_id]")
      revision = event.get("[@metadata][revision]")
      reason = event.get("[@metadata][dead_letter_queue][reason]").to_s
      failure = reason.include?("status: 400") ? "document_400" : (reason.include?("status: 404") ? "document_404" : "document_failure")
      event.to_hash.keys.each { |key| event.remove(key) }
      event.set("kind", kind)
      event.set("sourceId", source_id)
      event.set("revision", revision)
      event.set("failure", failure)
    '
  }
}
output { stdout { codec => json_lines } }
